name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        neovim:
          - stable
          - nightly

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # pandoc for the exports; latexdiff and a small TeX for the builds and the tracked-changes PDF
      # (texlive-science: siunitx, in the test document; biber, biblatex and zip: the submissions)
      - name: Install pandoc, latexdiff and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc latexdiff latexmk texlive-latex-recommended texlive-latex-extra texlive-science poppler-utils biber texlive-bibtex-extra zip unzip

      # R, for the .Rnw and .Rmd tests: knitr and rmarkdown from Ubuntu, knitrmini from GitHub
      - name: Install R, rmarkdown and knitrmini
        run: |
          sudo apt-get install -y r-base-core r-cran-knitr r-cran-rmarkdown r-cran-remotes
          sudo Rscript -e 'remotes::install_github("urtzienriquez/knitrmini", upgrade = "never")'
          Rscript -e 'library(knitrmini); library(rmarkdown)'

      - name: Install plenary.nvim and neoffice.nvim
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary.nvim
          git clone --depth 1 https://github.com/urtzienriquez/neoffice.nvim /tmp/neoffice.nvim

      - name: Run tests
        env:
          PLENARY_DIR: /tmp/plenary.nvim
          NEOFFICE_DIR: /tmp/neoffice.nvim
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests {minimal_init='tests/minimal_init.lua', sequential=true, timeout=1800000}"
